name: Auto-generate waypoints.json (PR)

# Uses `pull_request`, not `pull_request_target`. The build job below checks
# out and executes this PR's own version of concatenate_waypoints.py — for a
# genuine fork PR, GitHub forces the token in this run to read-only with no
# secrets, no matter what `permissions:` below asks for, so that's safe. It
# also means a real fork can never authenticate to push back here anyway;
# the "Commit changes" step below detects that and fails with an
# explanation instead of a confusing raw git error. Same-repo PRs (not
# forks) keep the original auto-commit-back behaviour unchanged.
on:
  pull_request:
    branches: [ main ]
    paths:
      - ".data/waypoints/**"
      - ".github/workflows/concatenate_waypoints.py"

concurrency:
  group: waypoints-build-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build waypoints.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Concatenate and clean files
        run: python .github/workflows/concatenate_waypoints.py

      - name: Commit changes (if any) and push back to PR
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add waypoints.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update waypoints.json"
          git pull --rebase
          if git push; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain when auto-push isn't possible (fork PRs)
        if: steps.commit.outputs.pushed == 'false'
        run: |
          echo "::error::waypoints.json is out of date and this PR is from a fork, so the bot has no permission to push the update here."
          echo "::error::Please run 'python .github/workflows/concatenate_waypoints.py' locally and commit the updated waypoints.json, or ask a maintainer to enable 'Allow edits from maintainers' on this PR."
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Upload cleaned files
          path: waypoints.json