name: Auto-fix duplicate callsigns

# Manually triggered (and optionally weekly) — this is a repo-wide cleanup,
# not tied to any one PR, so it opens its own PR for review rather than
# committing directly. It only removes exact duplicate rows (same ICAO +
# same callsign repeated) via dedupe_callsigns.py, which never touches
# entries where the callsign text actually differs — those need a human
# to pick the right one and are left for someone to fix by hand.
#
# This always runs on main (not a PR head), so there's no fork-trust
# concern here — same reasoning as data-validate-push.yml.

on:
  workflow_dispatch: {}
  # Uncomment to also run automatically, e.g. weekly:
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: callsigns-autofix
  cancel-in-progress: false

jobs:
  dedupe:
    name: Remove exact duplicate callsigns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run dedupe script
        id: dedupe
        run: |
          python .github/workflows/dedupe_callsigns.py --repo-root .

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- callsigns.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if nothing to fix
        if: steps.diff.outputs.changed == 'false'
        run: echo "callsigns.json already has no exact duplicates — nothing to do."

      - name: Check for an existing open PR
        id: existing
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh pr list --state open --head "chore/dedupe-callsigns" --json number --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Commit and push fix branch
        id: commit
        if: steps.diff.outputs.changed == 'true' && steps.existing.outputs.count == '0'
        run: |
          REMOVED=$(git diff -- callsigns.json | grep -c '^-.*"icao"')
          BRANCH="chore/dedupe-callsigns"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add callsigns.json
          git commit -m "Remove $REMOVED exact duplicate callsign entr$([ "$REMOVED" = "1" ] && echo y || echo ies)"
          git push -u origin "$BRANCH" --force

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "removed=$REMOVED" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.diff.outputs.changed == 'true' && steps.existing.outputs.count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const removed = ${{ steps.commit.outputs.removed }};
            const branch = '${{ steps.commit.outputs.branch }}';

            const body = [
              'Automated cleanup from the *Auto-fix duplicate callsigns* workflow.',
              '',
              `This removes ${removed} row(s) where the exact same \`icao\` + \`callsign\` pair was repeated — plain redundant copies with no information loss. It does **not** touch ICAO codes that have genuinely conflicting callsign text (different airlines/entries competing for the same code); those still need a human to pick the correct one and remain in the data-validation warnings.`,
              '',
              'Generated by `.github/workflows/dedupe_callsigns.py`.',
            ].join('\n');

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Remove exact duplicate callsigns.json entries',
              base: 'main',
              head: branch,
              body,
              maintainer_can_modify: true,
            }).then(async (pr) => {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.data.number,
                reviewers: ['jyang365'],
              });
            });

      - name: Note existing PR
        if: steps.diff.outputs.changed == 'true' && steps.existing.outputs.count != '0'
        run: echo "An open dedupe PR already exists on branch chore/dedupe-callsigns — not opening another."
